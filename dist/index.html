<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14100c"><meta name="description" content="Afterfall: a 2D pixel survival expedition. Save the last greenhouse and bring the planet back to life."><title>Afterfall · The Last Greenhouse</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%2314100c'/%3E%3Cpath d='M7 6h2v8H7zM3 4h4v2H3zM9 3h4v2H9zM5 6h2v2H5zM9 5h2v2H9z' fill='%239fd36b'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap"><link rel="preload" as="image" href="assets/expedition-world.webp"><link rel="preload" as="image" href="assets/hero-einstein.webp"><link rel="preload" as="image" href="assets/objects-mobile.webp"><link rel="stylesheet" href="style.css?v=12"></head>
<body>
<main id="game">
 <canvas id="world"></canvas>
 <div class="vignette"></div>
 <header class="hud">
  <div class="hud-left">
   <div class="hero-card"><div class="portrait"><img id="portrait" src="assets/portrait-einstein.webp" alt=""></div>
   <div class="vitals">
    <div class="bar hp" data-i18n-title="hud.hp"><i data-icon="heart"></i><span class="track"><b id="hp-fill"></b></span><em id="hp">100</em></div>
    <div class="bar food" data-i18n-title="hud.food"><i data-icon="berry"></i><span class="track"><b id="food-fill"></b></span><em id="food">95</em></div>
    <div class="bar thirst" data-i18n-title="hud.thirst"><i data-icon="water"></i><span class="track"><b id="thirst-fill"></b></span><em id="thirst">95</em></div>
   </div></div>
  </div>
  <nav class="hud-right">
   <button id="craft-btn" class="px-btn square" data-i18n-aria="hud.craft"><span data-icon="hammer"></span></button>
   <button id="bag-btn" class="px-btn square" data-i18n-aria="hud.bag"><span data-icon="bag"></span></button>
   <button id="pause-btn" class="px-btn square" data-i18n-aria="hud.menu"><span data-icon="menu"></span></button>
  </nav>
 </header>
 <section class="quest" id="quest">
  <button id="quest-toggle" class="quest-head" aria-expanded="true"><span class="quest-gem"></span><b id="mission-title"></b><span id="waypoint" class="waypoint"></span></button>
  <div class="quest-body"><p id="mission-desc"></p><div id="goal-list" class="goal-list"></div><div class="quest-meta"><span id="day"></span><span id="restored"></span></div></div>
 </section>
 <section id="dialog" class="quest dialog" hidden aria-live="polite"><img id="dlg-face" class="dlg-face" alt=""><div class="dlg-body"><b id="dlg-who"></b><p id="dlg-text"></p></div></section>
 <div id="scene-title" class="scene-title" hidden></div>
 <div id="rotate-hint" class="rotate-hint" hidden><p data-i18n="hint.rotate"></p><button id="rotate-ok" class="px-btn gold" data-i18n="hint.rotateOk"></button></div>
 <div id="toast" class="toast" role="status" aria-live="polite"></div>
 <div id="target-label" class="target-label"></div>
 <footer class="controls">
  <div class="stick-zone" id="move-pad" data-i18n-aria="ctl.zone"><div id="stick" class="stick" aria-hidden="true"><span class="stick-arrow l" data-icon="left"></span><span class="stick-arrow r" data-icon="right"></span><span id="pad-thumb"></span></div></div>
  <div class="actions">
   <button id="shoot" class="control c-shoot" data-key="K"><span data-icon="sling"></span><b data-i18n="ctl.shoot"></b><em id="ammo-count">0</em></button>
   <button id="jump" class="control c-jump" data-key="␣"><span data-icon="jump"></span><b data-i18n="ctl.jump"></b></button>
   <button id="attack" class="control c-attack" data-key="J"><span data-icon="sword"></span><b data-i18n="ctl.attack"></b></button>
   <button id="action" class="control c-action" data-key="E"><span data-icon="pickaxe"></span><b id="action-text"></b></button>
  </div>
 </footer>
 <nav id="hotbar" class="hotbar" aria-label="Hotbar"></nav>
 <div id="performance" class="perf" hidden></div>
</main>

<section id="hero-select" class="title-screen hero-screen" hidden>
 <div class="title-sky"></div>
 <div class="hero-panel"><h2 data-i18n="hero.title"></h2><div id="hero-cards" class="hero-cards"></div><button id="hero-go" class="px-btn primary big" data-i18n="hero.start"></button></div>
</section>
<section id="welcome" class="title-screen">
 <div class="title-sky"></div>
 <div class="title-card">
  <div class="logo"><span class="logo-sprout" data-icon="seed"></span><h1>AFTERFALL</h1><div class="logo-sub" data-i18n="title.sub"></div></div>
  <p class="tagline" data-i18n="menu.tagline"></p>
  <div class="menu-list">
   <button id="start-btn" class="px-btn primary big" disabled></button>
   <button id="new-btn" class="px-btn" hidden data-i18n="menu.new"></button>
   <button id="menu-settings" class="px-btn"><span data-icon="gear"></span><span data-i18n="menu.settings"></span></button>
  </div>
  <div id="new-confirm" class="confirm" hidden><p data-i18n="menu.newConfirm"></p><button id="new-yes" class="px-btn danger" data-i18n="menu.yesNew"></button><button id="new-no" class="px-btn ghost" data-i18n="common.cancel"></button></div>
  <div class="lang-row" role="group" aria-label="Language"><span data-icon="globe"></span><div class="seg small" data-setting="lang"></div></div>
  <small class="title-hint" data-i18n="menu.hint"></small>
 </div>
 <small class="version">v0.6</small>
</section>

<dialog id="craft-dialog" class="sheet wide"><div class="sheet-head"><div class="title-row"><span id="craft-badge"></span><h2 data-i18n="craft.title"></h2></div><button class="close px-btn square" data-i18n-aria="common.close"><span data-icon="close"></span></button></div>
 <div class="tabs craft-tabs" id="craft-tabs"><button data-cat="tools" data-i18n="tab.tools"></button><button data-cat="build" data-i18n="tab.build"></button><button data-cat="survival" data-i18n="tab.survival"></button><button data-cat="restore" data-i18n="tab.restore"></button></div>
 <div class="craft-body"><div id="recipes" class="recipe-list"></div><div id="recipe-detail" class="recipe-detail"></div></div>
 <p class="sheet-note" id="station-note"></p><div id="craft-inv" class="inv-strip"></div></dialog>

<dialog id="bag-dialog" class="sheet"><div class="sheet-head"><div><span class="eyebrow" data-i18n="bag.eyebrow"></span><h2 data-i18n="bag.title"></h2></div><button class="close px-btn square" data-i18n-aria="common.close"><span data-icon="close"></span></button></div><div id="inventory"></div><div class="row-buttons"><button id="drink-btn" class="px-btn" data-i18n="bag.drink"></button><button id="eat-btn" class="px-btn" data-i18n="bag.eat"></button></div><p class="sheet-note" data-i18n="bag.note"></p></dialog>

<dialog id="pause-dialog" class="sheet narrow"><div class="sheet-head"><div><span class="eyebrow" data-i18n="pause.eyebrow"></span><h2 data-i18n="pause.title"></h2></div><button class="close px-btn square" data-i18n-aria="common.close"><span data-icon="close"></span></button></div><p data-i18n="pause.text"></p><div class="menu-list"><button id="resume-btn" class="px-btn primary big"><span data-icon="play"></span><span data-i18n="pause.resume"></span></button><button id="pause-settings" class="px-btn"><span data-icon="gear"></span><span data-i18n="menu.settings"></span></button></div><p class="sheet-note keys" data-i18n="pause.help"></p></dialog>

<dialog id="settings-dialog" class="sheet"><div class="sheet-head"><div><span class="eyebrow">AFTERFALL</span><h2 data-i18n="set.title"></h2></div><button class="close px-btn square" data-i18n-aria="common.close"><span data-icon="close"></span></button></div>
 <div class="tabs" role="tablist">
  <button role="tab" data-tab="graphics" aria-selected="true" data-i18n="tab.graphics"></button><button role="tab" data-tab="controls" data-i18n="tab.controls"></button><button role="tab" data-tab="sound" data-i18n="tab.sound"></button><button role="tab" data-tab="language" data-i18n="tab.language"></button><button role="tab" data-tab="progress" data-i18n="tab.progress"></button>
 </div>
 <div class="tab-panel" data-panel="graphics">
  <div class="field"><label data-i18n="set.quality"></label><div class="seg" data-setting="quality"><button data-value="eco" data-i18n="q.eco"></button><button data-value="smooth" data-i18n="q.smooth"></button><button data-value="detail" data-i18n="q.detail"></button></div><p class="sheet-note" data-i18n="set.qualityNote"></p></div>
  <div class="field"><label data-i18n="set.fpsCap"></label><div class="seg" data-setting="fpsCap"><button data-value="30" data-i18n="fps.30"></button><button data-value="60" data-i18n="fps.60"></button><button data-value="120" data-i18n="fps.120"></button></div><p class="sheet-note" data-i18n="set.fpsCapNote"></p></div>
  <div class="field row"><label data-i18n="set.effects"></label><button class="toggle" data-setting="effects"></button></div>
  <div class="field row"><label data-i18n="set.hints"></label><button class="toggle" data-setting="hints"></button></div>
  <div class="field row"><label data-i18n="set.fps"></label><button class="toggle" data-setting="fps"></button></div>
 </div>
 <div class="tab-panel" data-panel="controls" hidden>
  <div class="field"><label data-i18n="set.hand"></label><div class="seg" data-setting="hand"><button data-value="left" data-i18n="hand.left"></button><button data-value="right" data-i18n="hand.right"></button></div></div>
  <div class="field"><label data-i18n="set.size"></label><div class="seg" data-setting="size"><button data-value="s" data-i18n="size.s"></button><button data-value="m" data-i18n="size.m"></button><button data-value="l" data-i18n="size.l"></button></div></div>
  <div class="field"><label data-i18n="set.actionMode"></label><div class="seg" data-setting="actionMode"><button data-value="tap" data-i18n="mode.tap"></button><button data-value="hold" data-i18n="mode.hold"></button></div></div>
  <div class="field row"><label data-i18n="set.swipe"></label><button class="toggle" data-setting="swipe"></button></div>
  <div class="field row"><label data-i18n="set.vibrate"></label><button class="toggle" data-setting="vibrate"></button></div>
 </div>
 <div class="tab-panel" data-panel="sound" hidden>
  <div class="field"><label for="music-vol"><span data-icon="music"></span> <span data-i18n="set.music"></span> <output id="music-out"></output></label><input type="range" id="music-vol" min="0" max="100" step="5" data-setting="music"></div>
  <div class="field"><label for="sfx-vol"><span data-icon="sound"></span> <span data-i18n="set.sfx"></span> <output id="sfx-out"></output></label><input type="range" id="sfx-vol" min="0" max="100" step="5" data-setting="sfx"></div>
 </div>
 <div class="tab-panel" data-panel="language" hidden>
  <div class="seg column" data-setting="lang"></div><p class="sheet-note" data-i18n="set.langNote"></p>
 </div>
 <div class="tab-panel" data-panel="progress" hidden>
  <div id="transfer" class="transfer"><p class="sheet-note" data-i18n="transfer.note"></p><label for="export-code" data-i18n="transfer.export"></label><textarea id="export-code" readonly rows="3"></textarea><button id="copy-code" class="px-btn" data-i18n="transfer.copy"></button><label for="import-code" data-i18n="transfer.import"></label><textarea id="import-code" rows="3" placeholder="AFTERFALL-1:…" autocomplete="off" spellcheck="false"></textarea><button id="import-btn" class="px-btn" data-i18n="transfer.load"></button><div id="import-confirm" hidden><p id="import-summary"></p><button id="import-yes" class="px-btn danger" data-i18n="transfer.yes"></button><button id="import-no" class="px-btn ghost" data-i18n="common.cancel"></button></div><p id="transfer-note" class="sheet-note" role="status"></p></div>
  <button id="reset-btn" class="px-btn ghost" data-i18n="set.reset"></button><div id="reset-confirm" class="confirm" hidden><p data-i18n="menu.newConfirm"></p><button id="reset-yes" class="px-btn danger" data-i18n="menu.yesNew"></button><button id="reset-no" class="px-btn ghost" data-i18n="common.cancel"></button></div>
 </div>
</dialog>

<dialog id="win-dialog" class="sheet narrow win-sheet"><div class="win-icon" data-icon="seed"></div><span class="eyebrow" id="win-eyebrow"></span><h2 id="win-title"></h2><p id="win-text"></p><div class="win-stat"><span id="win-value"></span><small id="win-label"></small></div><button id="continue-btn" class="px-btn primary big" data-i18n="win.continue"></button><p class="sheet-note" id="win-note"></p></dialog>
<script type="module" src="expedition-game.mjs?v=12"></script></body></html>
