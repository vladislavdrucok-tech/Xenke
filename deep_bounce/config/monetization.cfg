; Deep Bounce — every store and ad setting in one place.
; The game reads this file at runtime, the Android export plugin reads it at export time (App ID in the manifest).
; Owner: fill the [admob] real_* values and [billing] license_key, then set use_test_ads=false for the store build.

[admob]
; Google's official test IDs: https://developers.google.com/admob/android/test-ads
use_test_ads=true
test_app_id="ca-app-pub-3940256099942544~3347511713"
test_rewarded_revive="ca-app-pub-3940256099942544/5224354917"
test_rewarded_double="ca-app-pub-3940256099942544/5224354917"
test_interstitial="ca-app-pub-3940256099942544/1033173712"
; Real values from AdMob → Apps → Deep Bounce (App ID) and → Ad units (three separate units)
real_app_id=""
real_rewarded_revive=""
real_rewarded_double=""
real_interstitial=""
; Hashed device IDs printed by the SDK in logcat ("Use RequestConfiguration.Builder().setTestDeviceIds"), comma separated
test_device_ids=""
; Show the UMP consent form as if the device were in the EEA (only with use_test_ads=true)
debug_geography_eea=false
; Max ad content rating matched to the game's Play rating (G, PG, T, MA)
max_ad_content_rating="PG"

[ads_caps]
; interstitial: never during the first N finished runs/attempts
free_runs=3
; then at least this many finished runs/attempts and this much active play time since the last interstitial
min_runs_between=3
min_active_seconds_between=180.0
; no interstitial after a run/attempt in which a rewarded ad was watched
skip_after_rewarded=true

[billing]
; Base64 RSA public key: Play Console → Deep Bounce → Monetize with Play → Monetization setup → Licensing.
; With a key every purchase signature is verified on the device; without it purchases are trusted as the
; Play Billing Library reports them (the build prints a warning).
license_key=""
