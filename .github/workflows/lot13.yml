# LOT 13: Lucky Garage — real Godot checks and an Android APK for every change in lot13/.
# Steps: import assets, rules self-test, UI smoke test (headless), export a debug-signed APK, upload it.
name: LOT 13 build

on:
  push:
    paths:
      - "lot13/**"
      - ".github/workflows/lot13.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GODOT_VERSION: "4.3"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-4.3-stable-v1

      - name: Install Godot 4.3 and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q Godot_v4.3-stable_linux.x86_64.zip && rm Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_export_templates.tpz && rm Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          mv templates/android_debug.apk templates/android_release.apk templates/android_source.zip templates/version.txt \
             ~/.local/share/godot/export_templates/4.3.stable/
          rm -rf templates

      - name: Configure the Android export
        run: |
          echo "GODOT=$HOME/godot/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          for f in editor_settings-4.tres editor_settings-4.3.tres; do
          cat > ~/.config/godot/$f <<CFG
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/lot13/tools/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          CFG
          sed -i 's/^          //' ~/.config/godot/$f
          done
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Import assets
        run: |
          $GODOT --headless --path lot13 --import > import.log 2>&1 || $GODOT --headless --path lot13 --editor --quit-after 2000 >> import.log 2>&1 || true
          tail -n 30 import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script" import.log

      - name: Rules self-test
        run: |
          timeout 300 $GODOT --headless --fixed-fps 60 --path lot13 -- --selftest > selftest.log 2>&1 || true
          cat selftest.log | tail -n 60
          grep -q "SELFTEST OK" selftest.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" selftest.log

      - name: UI smoke test
        run: |
          timeout 300 $GODOT --headless --fixed-fps 60 --path lot13 -- --smoke > smoke.log 2>&1 || true
          cat smoke.log | tail -n 60
          grep -q "SMOKE OK" smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load" smoke.log

      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/lot13/tools/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          $GODOT --headless --path lot13 --export-debug "Android" "$GITHUB_WORKSPACE/out/LOT13-Lucky-Garage.apk" > export.log 2>&1 || true
          tail -n 40 export.log
          ls -la "$GITHUB_WORKSPACE/out"
          test -s "$GITHUB_WORKSPACE/out/LOT13-Lucky-Garage.apk"

      - name: Screenshots (real renderer under Xvfb)
        run: |
          which xvfb-run || (sudo apt-get update -q && sudo apt-get install -y -q xvfb)
          mkdir -p shots
          xvfb-run -a -s "-screen 0 400x700x24" timeout 180 $GODOT --rendering-driver opengl3 --resolution 360x640 \
            --fixed-fps 60 --path lot13 -- --shots "$GITHUB_WORKSPACE/shots" > shots.log 2>&1 || true
          tail -n 25 shots.log
          ls -la shots
          ! grep -E "SCRIPT ERROR|Parse Error" shots.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot13-screenshots
          path: shots/*.png

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lot13-logs
          path: "*.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LOT13-Lucky-Garage-apk
          path: out/LOT13-Lucky-Garage.apk

      # Last step on purpose: screenshots as text, readable from the end of the job log.
      - name: Print screenshots
        if: always()
        run: |
          pip install -q pillow 2>/dev/null || pip install -q --user pillow
          python3 lot13/tools/shots_b64.py shots || true
